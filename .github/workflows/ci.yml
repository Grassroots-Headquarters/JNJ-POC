name: ci

on:
  pull_request:
  push:
    branches: [main, spec-23-platform-foundation]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_EXCLUDE: studio,mailpit,imgproxy,logflare,vector,supavisor,postgres-meta

jobs:
  checks:
    name: lint, typecheck, unit, database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: supabase/setup-cli@v3
      - name: Local Edge Function env (read by the edge runtime at start; holds the test-only webhook secret)
        run: cp supabase/functions/.env.example supabase/functions/.env
      - name: Start local Supabase
        run: pnpm supabase start -x "$SUPABASE_EXCLUDE"
      - run: pnpm supabase db reset
      - run: pnpm test:db
      - run: pnpm test:integration
      - name: Generated types must match the schema
        run: pnpm gen:types && git diff --exit-code -- packages/shared/src/database.types.ts
      - run: pnpm supabase stop --no-backup
        if: always()

  e2e:
    name: playwright (both web builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - uses: supabase/setup-cli@v3
      - name: Local Edge Function env (read by the edge runtime at start; holds the test-only webhook secret)
        run: cp supabase/functions/.env.example supabase/functions/.env
      - name: Start local Supabase
        run: pnpm supabase start -x "$SUPABASE_EXCLUDE"
      - name: Expose local Supabase to the apps
        # `status -o env` prints NAME="value"; $GITHUB_ENV keeps quotes as part of the value, so strip them.
        run: |
          pnpm --silent supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            | sed 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' >> "$GITHUB_ENV"
          pnpm --silent supabase status -o env \
            --override-name api.url=EXPO_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=EXPO_PUBLIC_SUPABASE_ANON_KEY \
            | sed 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Build the Admin app
        run: pnpm --filter @jnj/admin build
      - name: Export the Mobile app's web build
        run: pnpm --filter @jnj/mobile export:web
        env:
          CI: "1"
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - run: pnpm supabase stop --no-backup
        if: always()
